# ===================================================================
# BÀI THỰC HÀNH SỐ 4 - ORDER MANAGEMENT SERVICE (SOA ARCHITECTURE)
# ===================================================================
#   Auth Service    (BTH2) : http://localhost:8080
#   Product Service (BTH3) : http://localhost:8081
#   Order Service   (BTH4) : http://localhost:8082   <-- service này

# 1. Cổng chạy độc lập của Order Service
server.port=8082
spring.application.name=order-service

# Từ chối số lượng dạng số thực thay vì tự cắt phần thập phân khi đọc JSON
spring.jackson.deserialization.accept-float-as-int=false

# 2. Cơ sở dữ liệu RIÊNG của Order Service (Database-per-service)
#    H2 lưu ra file ./data/orderdb.mv.db -> tắt service bật lại vẫn còn dữ liệu,
#    không dùng chung CSDL với Product Service (productdb).
spring.datasource.url=jdbc:h2:file:./data/orderdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate tự tạo/cập nhật bảng orders và order_items theo entity
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Giao diện H2 Console: http://localhost:8082/h2-console
#    JDBC URL: jdbc:h2:file:./data/orderdb  |  User: sa  |  Password: (để trống)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# -------------------------------------------------------------------
# (TÙY CHỌN) Chuyển sang MySQL: comment 4 dòng spring.datasource + dialect H2 ở trên,
# rồi mở comment các dòng dưới (database order_db sẽ tự được tạo):
# spring.datasource.url=jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=123456
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# -------------------------------------------------------------------

# 3. Xác thực qua Auth Service (bài thực hành số 2)
auth.service.url=http://localhost:8080/auth
auth.service.timeout-ms=5000

# 4. Kiểm tra tồn kho qua Product Service (bài thực hành số 3)
product.service.url=http://localhost:8081
product.service.timeout-ms=5000
