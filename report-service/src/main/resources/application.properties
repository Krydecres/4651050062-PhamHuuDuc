# ===================================================================
# BÀI THỰC HÀNH SỐ 5 - REPORTING SERVICE (SOA ARCHITECTURE)
# ===================================================================
#   Auth Service    (BTH2) : http://localhost:8080
#   Product Service (BTH3) : http://localhost:8081
#   Order Service   (BTH4) : http://localhost:8082
#   Report Service  (BTH5) : http://localhost:8083   <-- service này

# 1. Cổng chạy độc lập của Report Service
server.port=8083
spring.application.name=report-service

# Từ chối số lượng dạng số thực thay vì tự cắt phần thập phân khi đọc JSON
spring.jackson.deserialization.accept-float-as-int=false

# 2. Cơ sở dữ liệu RIÊNG của Report Service (Database-per-service)
#    H2 lưu ra file ./data/reportdb.mv.db, không dùng chung với productdb / orderdb.
spring.datasource.url=jdbc:h2:file:./data/reportdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate tự tạo/cập nhật bảng orders_reports và product_reports theo entity
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Giao diện H2 Console: http://localhost:8083/h2-console
#    JDBC URL: jdbc:h2:file:./data/reportdb  |  User: sa  |  Password: (để trống)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# -------------------------------------------------------------------
# (TÙY CHỌN) Chuyển sang MySQL: comment 4 dòng spring.datasource + dialect H2 ở trên,
# rồi mở comment các dòng dưới (database report_db sẽ tự được tạo):
# spring.datasource.url=jdbc:mysql://localhost:3306/report_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=123456
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# -------------------------------------------------------------------

# 3. Xác thực qua Auth Service (bài thực hành số 2)
auth.service.url=http://localhost:8080/auth
auth.service.timeout-ms=5000

# 4. Lấy dữ liệu sản phẩm (bài 3) và đơn hàng (bài 4)
product.service.url=http://localhost:8081
product.service.timeout-ms=5000
order.service.url=http://localhost:8082
order.service.timeout-ms=5000

# 5. Tỷ lệ giá vốn mặc định: khi request không gửi unit_cost (giá nhập) của một sản phẩm,
#    giá nhập = unit_price (giá bán) x tỷ lệ này. Ví dụ 0.7 = giá nhập bằng 70% giá bán.
report.default-cost-ratio=0.7
