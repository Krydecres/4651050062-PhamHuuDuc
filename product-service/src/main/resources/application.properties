# ===================================================================
# BÀI THỰC HÀNH SỐ 3 - PRODUCT MANAGEMENT SERVICE (SOA ARCHITECTURE)
# ===================================================================

# 1. Cổng chạy độc lập của Product Service
#    (Auth Service - bài thực hành số 2 - chạy cổng 8080)
server.port=8081
spring.application.name=product-service

# Từ chối số lượng dạng số thực thay vì tự cắt phần thập phân khi đọc JSON
spring.jackson.deserialization.accept-float-as-int=false

# 2. Cơ sở dữ liệu RIÊNG của Product Service (Database-per-service)
#    H2 lưu ra file ./data/productdb.mv.db -> tắt service bật lại vẫn còn dữ liệu,
#    không cần cài thêm phần mềm CSDL nào.
spring.datasource.url=jdbc:h2:file:./data/productdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate tự tạo/cập nhật bảng products theo entity Product
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Giao diện H2 Console để xem bảng products: http://localhost:8081/h2-console
#    JDBC URL: jdbc:h2:file:./data/productdb  |  User: sa  |  Password: (để trống)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# -------------------------------------------------------------------
# (TÙY CHỌN) Chuyển sang MySQL: comment 4 dòng spring.datasource + dialect H2 ở trên,
# rồi mở comment các dòng dưới (database product_db sẽ tự được tạo):
# spring.datasource.url=jdbc:mysql://localhost:3306/product_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=123456
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# -------------------------------------------------------------------

# 3. Xác thực qua Auth Service (bài thực hành số 2)
auth.service.url=http://localhost:8080/auth
# Thời gian chờ tối đa khi gọi Auth Service (mili giây)
auth.service.timeout-ms=5000
